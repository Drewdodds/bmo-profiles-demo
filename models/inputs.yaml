# =============================================================================
# inputs.yaml — Map BMO warehouse tables to the customer entity.
#
# Five source schemas:
#   BMO_WEB_APP       — authenticated banking web (RudderStack JS SDK)
#   BMO_MARKETING_SITE— public marketing site (RudderStack JS SDK)
#   BMO_IOS_APP       — iOS banking app (RudderStack Swift SDK)
#   BMO_ANDROID_APP   — Android banking app (RudderStack Kotlin SDK)
#   BMO_ETL          — Fivetran-loaded core banking, CRM, OneTrust, Adobe AAM
#
# Naming: rs<TitleCase>, e.g. rsBmoWebAppLogin, rsBmoEtlCustomer.
# Event tables expose USER_ID / ANONYMOUS_ID / CONTEXT_TRAITS_UNIVERSAL_ID.
# ETL tables expose UNIVERSAL_ID / CUSTOMER_ID / EMAIL_HASH where applicable.
# =============================================================================
inputs:
  # ---------------------------------------------------------------------------
  # BMO_WEB_APP — authenticated banking web
  # ---------------------------------------------------------------------------
  - name: rsBmoWebAppIdentifies
    app_defaults:
      table: BMO_WEB_APP.IDENTIFIES
      occurred_at_col: TIMESTAMP
      ids:
        - select: USER_ID
          type: user_id
          entity: customer
        - select: ANONYMOUS_ID
          type: anonymous_id
          entity: customer
        - select: CONTEXT_TRAITS_UNIVERSAL_ID
          type: universal_id
          entity: customer
  - name: rsBmoWebAppPages
    app_defaults:
      table: BMO_WEB_APP.PAGES
